name: Sync Plugin Version with SDK

on:
  repository_dispatch:
    types: [sdk-release]
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version to sync to (leave empty to fetch from PyPI)"
        required: false
        type: string
      from_version:
        description: "SDK version to diff from (leave empty to use current plugin version)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Determine SDK version
        id: sdk-version
        run: |
          # Use version from dispatch payload, manual input, or fall back to PyPI
          if [ -n "${{ github.event.client_payload.version }}" ]; then
            SDK_VERSION="${{ github.event.client_payload.version }}"
            echo "Version from SDK release dispatch: $SDK_VERSION"
          elif [ -n "${{ inputs.version }}" ]; then
            SDK_VERSION="${{ inputs.version }}"
            echo "Version from manual input: $SDK_VERSION"
          else
            SDK_VERSION=$(curl -s https://pypi.org/pypi/rapidata/json | jq -r '.info.version')
            echo "Version from PyPI: $SDK_VERSION"
          fi
          echo "version=$SDK_VERSION" >> "$GITHUB_OUTPUT"

      - name: Get current plugin version
        id: plugin-version
        run: |
          PLUGIN_VERSION=$(jq -r '.version' plugins/rapidata-sdk-plugin/.claude-plugin/plugin.json)
          echo "version=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "Current plugin version: $PLUGIN_VERSION"

      - name: Determine old version for diff
        id: old-version
        run: |
          if [ -n "${{ inputs.from_version }}" ]; then
            OLD_VERSION="${{ inputs.from_version }}"
            echo "Using manual from_version: $OLD_VERSION"
          else
            OLD_VERSION="${{ steps.plugin-version.outputs.version }}"
            echo "Using current plugin version: $OLD_VERSION"
          fi
          echo "version=$OLD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if update is needed
        id: should-update
        run: |
          OLD_VERSION="${{ steps.old-version.outputs.version }}"
          NEW_VERSION="${{ steps.sdk-version.outputs.version }}"
          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Old and new versions are the same ($OLD_VERSION). Nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Will update from $OLD_VERSION to $NEW_VERSION"
          fi

      - name: Update plugin version
        if: steps.should-update.outputs.skip != 'true'
        run: |
          NEW_VERSION="${{ steps.sdk-version.outputs.version }}"
          CURRENT_VERSION="${{ steps.plugin-version.outputs.version }}"
          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            jq --arg v "$NEW_VERSION" '.version = $v' \
              plugins/rapidata-sdk-plugin/.claude-plugin/plugin.json > tmp.json
            mv tmp.json plugins/rapidata-sdk-plugin/.claude-plugin/plugin.json
            git add plugins/rapidata-sdk-plugin/.claude-plugin/plugin.json
            echo "Updated plugin version to $NEW_VERSION"
          else
            echo "Plugin version already at $NEW_VERSION, skipping version bump"
          fi

      - name: Clone SDK and generate diff
        id: sdk-diff
        if: steps.should-update.outputs.skip != 'true'
        run: |
          OLD_VERSION="${{ steps.old-version.outputs.version }}"
          NEW_VERSION="${{ steps.sdk-version.outputs.version }}"

          git clone --bare --filter=blob:none https://github.com/RapidataAI/rapidata-python-sdk.git /tmp/sdk-repo

          # Resolve tags — handle both "v1.2.3" and "1.2.3" formats
          resolve_tag() {
            local ver="$1"
            local repo="/tmp/sdk-repo"
            if git -C "$repo" rev-parse "v${ver}" >/dev/null 2>&1; then
              echo "v${ver}"
            elif git -C "$repo" rev-parse "${ver}" >/dev/null 2>&1; then
              echo "${ver}"
            else
              echo ""
            fi
          }

          OLD_TAG=$(resolve_tag "$OLD_VERSION")
          NEW_TAG=$(resolve_tag "$NEW_VERSION")

          if [ -z "$OLD_TAG" ] || [ -z "$NEW_TAG" ]; then
            echo "::error::Could not resolve SDK tags (old='$OLD_TAG' new='$NEW_TAG')."
            exit 1
          fi

          echo "Generating diff between $OLD_TAG and $NEW_TAG"

          # api_client and openapi/ are generated from the spec and carry no
          # user-facing API information — openapi/ alone was ~80% of the diff.
          EXCLUDES=(':!src/rapidata/api_client' ':!openapi' ':!uv.lock')

          git -C /tmp/sdk-repo diff "$OLD_TAG" "$NEW_TAG" -- "${EXCLUDES[@]}" > /tmp/sdk-diff.txt
          git -C /tmp/sdk-repo diff --stat "$OLD_TAG" "$NEW_TAG" -- "${EXCLUDES[@]}" > /tmp/sdk-diff-stat.txt

          if [ ! -s /tmp/sdk-diff.txt ]; then
            echo "::error::SDK diff is empty between $OLD_TAG and $NEW_TAG."
            exit 1
          fi

          echo "SDK diff generated ($(wc -c < /tmp/sdk-diff.txt) bytes)"
          cat /tmp/sdk-diff-stat.txt

      - name: Update skill docs with Claude
        id: claude-docs
        if: steps.should-update.outputs.skip != 'true'
        # A failure here must not abort the job: the version bump still has to be
        # committed, otherwise the next run diffs from the same stale version and
        # the diff compounds until no run can ever succeed. The "Verify doc update"
        # step below turns the job red after the commit lands.
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code

          SKILL_DIR="plugins/rapidata-sdk-plugin/skills/rapidata"

          # Paths are handed over instead of file contents: the Write tool refuses to
          # overwrite a file that was not Read in-session, so inlining the docs here
          # made the first Write on every file fail and burn the turn budget.
          cat > /tmp/claude-prompt.txt << PROMPT
          You are updating the skill documentation for a Claude Code plugin that teaches Claude the Rapidata Python SDK.

          The three skill files to update are on disk:
          - $SKILL_DIR/SKILL.md — core concepts, task types, common patterns
          - $SKILL_DIR/reference.md — full API reference
          - $SKILL_DIR/examples.md — runnable code examples

          The SDK changes between the old and the new version are on disk too:
          - /tmp/sdk-diff-stat.txt — per-file summary of the diff; read this first to see which files changed
          - /tmp/sdk-diff.txt — the full diff (generated API client and OpenAPI spec already excluded)

          HOW TO WORK:
          1. Read /tmp/sdk-diff-stat.txt, then read or grep /tmp/sdk-diff.txt for the user-facing changes. If the full diff is large, grep it by file or symbol rather than reading it whole.
          2. Read the skill files you need to change.
          3. Apply targeted changes with the Edit tool. Use Edit, never Write — do not rewrite whole files, and do not create new files.

          RULES:
          - Only update what the diff evidences. Do NOT invent features or capabilities not shown in the diff.
          - Preserve the existing style, structure, and formatting of each file.
          - Only modify files that actually need changes. If a file needs no changes, leave it exactly as-is.
          - Do NOT add or remove sections unless the diff clearly warrants it.
          - Focus on: new/changed API methods, parameter changes, renamed classes, removed features, and new examples if clearly demonstrated in the diff.
          - Ignore changes to tests, CI workflows, and packaging metadata — they are not user-facing.
          PROMPT

          cat /tmp/claude-prompt.txt | claude -p \
            --model claude-opus-4-8 \
            --dangerously-skip-permissions \
            --max-turns 60 \
            --output-format stream-json \
            --verbose

          # Revert any files Claude touched outside the allowed set
          ALLOWED_FILES=(
            "$SKILL_DIR/SKILL.md"
            "$SKILL_DIR/reference.md"
            "$SKILL_DIR/examples.md"
          )
          for changed_file in $(git diff --name-only); do
            is_allowed=false
            for allowed in "${ALLOWED_FILES[@]}"; do
              if [ "$changed_file" = "$allowed" ]; then
                is_allowed=true
                break
              fi
            done
            if [ "$is_allowed" = false ]; then
              echo "Reverting unauthorized change: $changed_file"
              git checkout -- "$changed_file"
            fi
          done

      - name: Discard partial doc edits if the update failed
        if: steps.should-update.outputs.skip != 'true' && steps.claude-docs.outcome != 'success'
        run: |
          SKILL_DIR="plugins/rapidata-sdk-plugin/skills/rapidata"
          # A run that dies part-way leaves some files edited and others untouched;
          # committing that mix would publish half-updated docs. Keep only the
          # mechanical version bump, which the next step re-applies.
          git checkout -- "$SKILL_DIR/SKILL.md" "$SKILL_DIR/reference.md" "$SKILL_DIR/examples.md"
          echo "Discarded partial skill-doc edits."

      - name: Update pinned SDK version in SKILL.md
        if: steps.should-update.outputs.skip != 'true'
        run: |
          NEW_VERSION="${{ steps.sdk-version.outputs.version }}"
          SKILL_FILE="plugins/rapidata-sdk-plugin/skills/rapidata/SKILL.md"
          # Runs after the doc update so it also normalises any stale `v<semver>` that
          # Claude may have written into the outdated-skill warning message.
          sed -i -E \
            -e "s|(This skill is pinned to \*\*Rapidata SDK v)[0-9]+\.[0-9]+\.[0-9]+(\*\*)|\1${NEW_VERSION}\2|" \
            -e "s|(skill is pinned to v)[0-9]+\.[0-9]+\.[0-9]+|\1${NEW_VERSION}|" \
            "$SKILL_FILE"
          echo "Pinned SDK version in $SKILL_FILE updated to $NEW_VERSION"
          grep -n "Rapidata SDK v" "$SKILL_FILE" || true

      - name: Commit and push
        if: steps.should-update.outputs.skip != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add plugins/rapidata-sdk-plugin/.claude-plugin/plugin.json
          git add plugins/rapidata-sdk-plugin/skills/rapidata/SKILL.md
          git add plugins/rapidata-sdk-plugin/skills/rapidata/reference.md
          git add plugins/rapidata-sdk-plugin/skills/rapidata/examples.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync plugin version to SDK v${{ steps.sdk-version.outputs.version }}"
            git push
          fi

      - name: Verify doc update succeeded
        if: steps.should-update.outputs.skip != 'true' && steps.claude-docs.outcome != 'success'
        run: |
          NEW_VERSION="${{ steps.sdk-version.outputs.version }}"
          echo "::error::Skill docs were NOT updated for SDK v${NEW_VERSION} — the Claude step failed. The version bump was committed anyway so the next release diffs from v${NEW_VERSION} rather than compounding, but the docs still describe the previous version. Re-run this workflow manually with from_version set to the last version whose docs were correct."
          exit 1
